name: Tests
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - name: Cache Neovim data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim
          key: ${{ runner.os }}-nvim-data-${{ hashFiles('lazy-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nvim-data-
      # Install tools for setup
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install just
        run: |
          uv tool install rust-just
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fzf fd-find
          just install
      - name: Bootstrap plugins
        run: |
          # Set XDG_CONFIG_HOME so Neovim finds this checkout as its config
          export XDG_CONFIG_HOME=$(pwd)/..
          # Rename directory to nvim so Neovim finds it
          cd ..
          if [ "$(basename $OLDPWD)" != "nvim" ]; then
            ln -sf "$OLDPWD" nvim
          fi
          cd nvim
          # First run installs lazy.nvim and syncs plugins
          nvim --headless +"Lazy! sync" +qa || true
          # Second run ensures everything is stable
          nvim --headless +qa
      - name: Install LSP servers
        run: |
          export XDG_CONFIG_HOME=$(pwd)/..
          cd ..
          if [ "$(basename $OLDPWD)" != "nvim" ]; then
            ln -sf "$OLDPWD" nvim
          fi
          cd nvim
          # Install required LSP servers and tools via Mason
          nvim --headless +"MasonInstall ruff lua-language-server mypy cspell" +"sleep 30" +qa || true
      - name: Run tests
        run: |-
          export XDG_CONFIG_HOME=$(pwd)/..
          cd ..
          if [ "$(basename $OLDPWD)" != "nvim" ]; then
            ln -sf "$OLDPWD" nvim
          fi
          cd nvim
          just test
